name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verificar recibo válido
        run: npm run verify -- ../examples/rehearsal-uanl.json
      - name: Rechazar recibo alterado
        run: |
          if npm run verify -- ../examples/tampered-uanl.json; then
            echo "El recibo alterado pasó la verificación"; exit 1
          fi

  stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile stt/testalk_stt.py
